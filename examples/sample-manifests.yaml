# Sample manifests covering all three audited rules plus one clean workload.
# Used both as documentation of the expected input shape and as a fixture in tests/.
apiVersion: v1
kind: Pod
metadata:
  name: privileged-debug-pod
  namespace: default
spec:
  containers:
    - name: debug
      image: busybox:1.36
      securityContext:
        privileged: true
      resources:
        limits:
          cpu: "250m"
          memory: "128Mi"
        requests:
          cpu: "250m"
          memory: "128Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-shipper
  namespace: observability
spec:
  template:
    spec:
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
      containers:
        - name: shipper
          image: fluent-bit:2.2
          resources:
            limits:
              cpu: "100m"
              memory: "64Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: no-limits-app
  namespace: default
spec:
  template:
    spec:
      containers:
        - name: app
          image: internal/app:1.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliant-app
  namespace: default
spec:
  template:
    spec:
      containers:
        - name: app
          image: internal/clean-app:1.0
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "250m"
              memory: "128Mi"
